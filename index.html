<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Inventario - UGM</title>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        :root {
            --bg-dark: #172437; /* Fondo oscuro de la app */
            --bg-card: #ffffff;
            --primary-blue: #1e3d99; /* Azul del encabezado de la segunda imagen */
            --btn-green: #00a66a;    /* Verde del botón de registro */
            --btn-blue: #1e3d99;
            --accent-line: #1e3d99;  /* Barrita lateral azul */
            --text-muted: #7f8c8d;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg-dark);
            display: flex;
            justify-content: center;
        }

        .wrapper {
            width: 100%;
            max-width: 550px; /* Tamaño compacto tipo móvil */
        }

        /* Encabezado exacto a la segunda imagen */
        .main-header {
            background-color: var(--primary-blue);
            color: white;
            text-align: center;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            margin-bottom: 20px;
        }

        .main-header h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .main-header p {
            margin: 5px 0 0 0;
            font-size: 0.85rem;
            opacity: 0.9;
        }

        /* Tarjetas blancas redondeadas */
        .card {
            background-color: var(--bg-card);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        /* Títulos con la barrita azul al lado izquierdo (|) */
        .card-title {
            font-size: 1.05rem;
            font-weight: bold;
            color: #2c3e50;
            margin-top: 0;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-title::before {
            content: "";
            display: inline-block;
            width: 4px;
            height: 18px;
            background-color: var(--accent-line);
            border-radius: 2px;
        }

        /* Botón de Escaneo estilo "Registrar Entrada" */
        .btn-action {
            width: 100%;
            background-color: var(--btn-green);
            color: white;
            border: none;
            padding: 14px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        /* Zona de la cámara */
        #camera-preview {
            width: 100%;
            margin-top: 15px;
            border-radius: 10px;
            overflow: hidden;
            border: none !important;
        }

        .placeholder-text {
            color: var(--text-muted);
            text-align: center;
            font-size: 0.9rem;
            padding: 10px 0;
        }

        /* Formulario de Datos Escaneados */
        .form-group {
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 0.8rem;
            font-weight: bold;
            color: #555;
            margin-bottom: 4px;
        }

        .form-group input, .form-group select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 0.9rem;
            background-color: #f8f9fa;
            color: #333;
        }

        /* Resaltar visualmente los campos que sí se pueden editar */
        .form-group.editable input, .form-group.editable select {
            background-color: #ffffff;
            border: 1.5px solid var(--primary-blue);
        }

        .btn-submit {
            width: 100%;
            background-color: var(--btn-blue);
            color: white;
            border: none;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="wrapper">

        <div class="main-header">
            <h1>Control de Inventario</h1>
            <p>Visor de Validación - Cámara QR/Barras Activa</p>
        </div>

        <div class="card">
            <h2 class="card-title">¿Qué registro deseas realizar?</h2>
            <button class="btn-action" id="btn-reader" onclick="toggleScanner()">
                📷 ESCANEAR CÓDIGO DE ACTIVO
            </button>
            <div id="camera-preview" style="display: none;"></div>
        </div>

        <div class="card">
            <h2 class="card-title">Detalles del Activo Fijo</h2>
            
            <div id="no-data" class="placeholder-text">
                No hay registros en esta sesión.
            </div>

            <form id="asset-form" style="display: none;" onsubmit="handleFormSubmit(event)">
                
                <div class="form-group">
                    <label>Código del Activo</label>
                    <input type="text" id="view-code" readonly>
                </div>

                <div class="form-group">
                    <label>Ítem</label>
                    <input type="text" id="view-item" readonly>
                </div>

                <div class="form-group">
                    <label>Descripción del Activo</label>
                    <input type="text" id="view-description" readonly>
                </div>

                <div class="form-group editable">
                    <label>Ubicación Actual ✏️</label>
                    <input type="text" id="edit-location" required>
                </div>

                <div class="form-group editable">
                    <label>Estado del Activo ✏️</label>
                    <select id="edit-status" required>
                        <option value="En funcionamiento">En funcionamiento</option>
                        <option value="Dado de baja">Dado de baja</option>
                        <option value="En mantención">En mantención</option>
                    </select>
                </div>

                <button type="submit" class="btn-submit">💾 GUARDAR CAMBIOS EN SHAREPOINT</button>
            </form>
        </div>

    </div>

    <script>
        let scannerInstance;
        let scanningState = false;

        // Función para abrir/cerrar el cajón de la cámara
        function toggleScanner() {
            const previewDiv = document.getElementById('camera-preview');
            const btn = document.getElementById('btn-reader');

            if (!scanningState) {
                previewDiv.style.display = 'block';
                btn.innerText = "🛑 DETENER LECTOR";
                btn.style.backgroundColor = "#d32f2f"; // Cambia a rojo al estar activo
                scanningState = true;

                scannerInstance = new Html5Qrcode("camera-preview");
                scannerInstance.start(
                    { facingMode: "environment" }, // Usa la cámara de atrás del celular
                    { fps: 10, qrbox: { width: 250, height: 150 } },
                    onScanSuccess
                ).catch(err => {
                    alert("Error al iniciar cámara: " + err);
                    resetScannerUI();
                });
            } else {
                resetScannerUI();
            }
        }

        function resetScannerUI() {
            if (scannerInstance) {
                scannerInstance.stop().then(() => {
                    document.getElementById('camera-preview').style.display = 'none';
                    const btn = document.getElementById('btn-reader');
                    btn.innerText = "📷 ESCANEAR CÓDIGO DE ACTIVO";
                    btn.style.backgroundColor = "var(--btn-green)";
                    scanningState = false;
                });
            }
        }

        // Ejecución automática al detectar un código de barras válido
        function onScanSuccess(decodedText) {
            resetScannerUI();
            getSharePointData(decodedText);
        }

        // --- CONEXIÓN DE CONSULTA (Ajustar con tu API/Fetch) ---
        function getSharePointData(codigoEscaneado) {
            document.getElementById('no-data').innerText = "Buscando código: " + codigoEscaneado + "...";

            // Simulación de respuesta de la base de datos de SharePoint
            setTimeout(() => {
                const respuestaSimuladaSharePoint = {
                    codigo: codigoEscaneado,
                    item: "Notebook Corporativo",
                    descripcion: "HP ProBook G9 Intel i5 16GB RAM",
                    ubicacion: "Bodega Audiovisual",
                    estado: "En funcionamiento"
                };

                // Ocultamos el mensaje vacío y mostramos el formulario con los detalles
                document.getElementById('no-data').style.display = 'none';
                document.getElementById('asset-form').style.display = 'block';

                // Rellenamos los cuadros de texto correspondientes
                document.getElementById('view-code').value = respuestaSimuladaSharePoint.codigo;
                document.getElementById('view-item').value = respuestaSimuladaSharePoint.item;
                document.getElementById('view-description').value = respuestaSimuladaSharePoint.descripcion;
                
                // Estos quedan listos para editar si el usuario quiere
                document.getElementById('edit-location').value = respuestaSimuladaSharePoint.ubicacion;
                document.getElementById('edit-status').value = respuestaSimuladaSharePoint.estado;

            }, 600);
        }

        // --- ENVIAR EDICIÓN A SHAREPOINT ---
        function handleFormSubmit(event) {
            event.preventDefault();

            // Captura los datos modificados del formulario
            const datosAEnviar = {
                codigo: document.getElementById('view-code').value,
                ubicacion: document.getElementById('edit-location').value,
                estado: document.getElementById('edit-status').value
            };

            // Aquí ejecutas tu llamado Fetch hacia tu webhook de Power Automate o API
            console.log("Enviando actualización...", datosAEnviar);

            alert("¡Cambios registrados! Se actualizó el estado y ubicación en SharePoint.");

            // Limpiamos la pantalla volviendo al estado original
            document.getElementById('asset-form').style.display = 'none';
            const placeholder = document.getElementById('no-data');
            placeholder.style.display = 'block';
            placeholder.innerText = "No hay registros en esta sesión.";
        }
    </script>
</body>
</html>
