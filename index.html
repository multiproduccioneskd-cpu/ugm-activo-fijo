<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Inventario - UGM</title>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        :root {
            --bg-dark: #172437; 
            --bg-card: #ffffff;
            --primary-blue: #1e3d99; /* Azul de la segunda imagen */
            --btn-green: #00a66a;    /* Verde del botón de registro */
            --btn-blue: #1e3d99;
            --accent-line: #1e3d99;  /* Barrita lateral azul | */
            --text-muted: #7f8c8d;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg-dark);
            display: flex;
            justify-content: center;
        }

        .wrapper {
            width: 100%;
            max-width: 550px; 
        }

        .main-header {
            background-color: var(--primary-blue);
            color: white;
            text-align: center;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            margin-bottom: 20px;
        }

        .main-header h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .main-header p {
            margin: 5px 0 0 0;
            font-size: 0.85rem;
            opacity: 0.9;
        }

        /* Las dos únicas tarjetas de la app */
        .card {
            background-color: var(--bg-card);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        .card-title {
            font-size: 1.05rem;
            font-weight: bold;
            color: #2c3e50;
            margin-top: 0;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-title::before {
            content: "";
            display: inline-block;
            width: 4px;
            height: 18px;
            background-color: var(--accent-line);
            border-radius: 2px;
        }

        .btn-action {
            width: 100%;
            background-color: var(--btn-green);
            color: white;
            border: none;
            padding: 14px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 10px;
        }

        #camera-preview {
            width: 100%;
            border-radius: 10px;
            overflow: hidden;
            border: none !important;
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 0.8rem;
            font-weight: bold;
            color: #555;
            margin-bottom: 4px;
        }

        .form-group input, .form-group select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 0.9rem;
            background-color: #f8f9fa;
            color: #333;
            box-sizing: border-box;
        }

        /* Resalte para los campos editables */
        .form-group.editable input, .form-group.editable select {
            background-color: #ffffff;
            border: 1.5px solid var(--primary-blue);
        }

        /* Buscador predictivo */
        .search-container {
            position: relative;
        }

        .suggestions-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid #ccc;
            border-top: none;
            border-radius: 0 0 8px 8px;
            max-height: 140px;
            overflow-y: auto;
            z-index: 1000;
            margin: 0;
            padding: 0;
            list-style: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: none;
        }

        .suggestions-list li {
            padding: 10px;
            cursor: pointer;
            font-size: 0.9rem;
            border-bottom: 1px solid #f1f1f1;
        }

        .suggestions-list li:hover {
            background-color: #f1f4fa;
        }

        .preview-image-container {
            margin-top: 10px;
            display: none;
            text-align: center;
        }

        .preview-image-container img {
            max-width: 100%;
            max-height: 140px;
            border-radius: 6px;
            border: 1px dashed var(--primary-blue);
        }

        .btn-submit {
            width: 100%;
            background-color: var(--btn-blue);
            color: white;
            border: none;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 5px;
            text-transform: uppercase;
        }

        .status-msg {
            font-size: 0.9rem;
            color: var(--text-muted);
            text-align: center;
            padding: 10px 0;
        }
    </style>
</head>
<body>

    <div class="wrapper">

        <div class="main-header">
            <h1>Control de Inventario</h1>
            <p>Visor de Validación - Gestión de Activos</p>
        </div>

        <div class="card">
            <h2 class="card-title">¿Qué registro deseas realizar?</h2>
            
            <button class="btn-action" id="btn-reader" onclick="toggleScanner()">
                📷 ESCANEAR CÓDIGO DE ACTIVO
            </button>
            
            <div id="camera-preview" style="display: none;"></div>

            <div id="scan-placeholder" class="status-msg">
                Presione el botón para escanear un activo y editar sus datos.
            </div>

            <form id="edit-asset-form" style="display: none;" onsubmit="handleAssetSubmit(event)">
                <hr style="border: 0; border-top: 1px solid #eee; margin: 15px 0;">
                
                <div class="form-group">
                    <label>Código del Activo</label>
                    <input type="text" id="view-code" readonly>
                </div>

                <div class="form-group">
                    <label>Ítem</label>
                    <input type="text" id="view-item" readonly>
                </div>

                <div class="form-group">
                    <label>Descripción del Activo Fijo</label>
                    <input type="text" id="view-description" readonly>
                </div>

                <div class="form-group editable">
                    <label>Ubicación Actual ✏️</label>
                    <input type="text" id="edit-location" required>
                </div>

                <div class="form-group editable">
                    <label>Estado del Activo ✏️</label>
                    <select id="edit-status" required>
                        <option value="En funcionamiento">En funcionamiento</option>
                        <option value="Dado de baja">Dado de baja</option>
                        <option value="En mantención">En mantención</option>
                    </select>
                </div>

                <button type="submit" class="btn-submit">💾 Actualizar en SharePoint</button>
            </form>
        </div>

        <div class="card">
            <h2 class="card-title">Cargar Evidencia Fotográfica</h2>
            
            <form id="photo-only-form" onsubmit="handlePhotoSubmit(event)">
                <div class="form-group search-container">
                    <label>Buscar Código / ID del Activo ✏️</label>
                    <input type="text" id="search-asset-id" autocomplete="off" placeholder="Escribe el ID del activo..." oninput="searchLiveAsset(this.value)" required>
                    <ul id="suggestions-box" class="suggestions-list"></ul>
                </div>

                <div class="form-group editable">
                    <label>Sacar Foto del Activo 📸✏️</label>
                    <input type="file" id="photo-file" accept="image/*" capture="environment" onchange="previewPhoto(event)" required>
                    
                    <div id="photo-preview-box" class="preview-image-container">
                        <img id="photo-preview-img" src="" alt="Vista previa">
                    </div>
                </div>

                <button type="submit" class="btn-submit">📤 Enviar Foto al Activo</button>
            </form>
        </div>

    </div>

    <script>
        // --- BASE DE DATOS LOCAL SIMULADA DE SHAREPOINT ---
        const listaActivosSharePoint = [
            { id: "UGM-010", item: "Notebook HP ProBook", desc: "Intel i5 16GB RAM", loc: "Bodega TI", est: "En funcionamiento" },
            { id: "UGM-025", item: "Proyector Epson Láser", desc: "PowerLite 5200 Lúmenes", loc: "Sala 3", est: "En funcionamiento" },
            { id: "UGM-033", item: "iMac 21.5-inch", desc: "Core i5 Late 2013 Restoration", loc: "Sala de Juntas", est: "En funcionamiento" },
            { id: "UGM-104", item: "Cámara PTZ Logitech", desc: "Integración OBS y YouTube", loc: "Auditorio Central", est: "En mantención" }
        ];

        let scannerInstance;
        let scanningState = false;
        let globalBase64Photo = "";

        // --- LÓGICA DEL CONTENEDOR 1: LECTOR Y DESPLIEGUE EN LA MISMA CAJA ---
        function toggleScanner() {
            const previewDiv = document.getElementById('camera-preview');
            const btn = document.getElementById('btn-reader');

            if (!scanningState) {
                previewDiv.style.display = 'block';
                btn.innerText = "🛑 DETENER LECTOR";
                btn.style.backgroundColor = "#d32f2f"; 
                scanningState = true;

                // Ocultar formulario anterior si es que había uno abierto
                document.getElementById('edit-asset-form').style.display = 'none';
                document.getElementById('scan-placeholder').style.display = 'block';
                document.getElementById('scan-placeholder').innerText = "Cámara activa, apunte a un código...";

                scannerInstance = new Html5Qrcode("camera-preview");
                scannerInstance.start(
                    { facingMode: "environment" }, 
                    { fps: 10, qrbox: { width: 250, height: 150 } },
                    onScanSuccess
                ).catch(err => {
                    alert("Error al iniciar cámara: " + err);
                    resetScannerUI();
                });
            } else {
                resetScannerUI();
            }
        }

        function resetScannerUI() {
            if (scannerInstance) {
                scannerInstance.stop().then(() => {
                    document.getElementById('camera-preview').style.display = 'none';
                    const btn = document.getElementById('btn-reader');
                    btn.innerText = "📷 ESCANEAR CÓDIGO DE ACTIVO";
                    btn.style.backgroundColor = "var(--btn-green)";
                    scanningState = false;
                });
            }
        }

        function onScanSuccess(decodedText) {
            resetScannerUI();
            fetchAssetDataInline(decodedText);
        }

        function fetchAssetDataInline(code) {
            document.getElementById('scan-placeholder').innerText = "Buscando código " + code + " en SharePoint...";
            
            setTimeout(() => {
                const activo = listaActivosSharePoint.find(a => a.id.toLowerCase() === code.toLowerCase()) || {
                    id: code, item: "Componente Detectado", desc: "Activo identificado vía escáner", loc: "Por definir", est: "En funcionamiento"
                };

                // Ocultamos el texto de espera y abrimos el formulario de edición adentro del Contenedor 1
                document.getElementById('scan-placeholder').style.display = 'none';
                document.getElementById('edit-asset-form').style.display = 'block';

                document.getElementById('view-code').value = activo.id;
                document.getElementById('view-item').value = activo.item;
                document.getElementById('view-description').value = activo.desc;
                document.getElementById('edit-location').value = activo.loc;
                document.getElementById('edit-status').value = activo.est;
            }, 500);
        }

        function handleAssetSubmit(event) {
            event.preventDefault();
            
            const dataToSync = {
                id: document.getElementById('view-code').value,
                ubicacion: document.getElementById('edit-location').value,
                estado: document.getElementById('edit-status').value
            };
            
            console.log("Sincronizando con SharePoint...", dataToSync);
            alert(`¡Activo ${dataToSync.id} sincronizado y actualizado con éxito en SharePoint!`);
            
            // Regresar al estado inicial del Contenedor 1
            document.getElementById('edit-asset-form').style.display = 'none';
            const placeholder = document.getElementById('scan-placeholder');
            placeholder.style.display = 'block';
            placeholder.innerText = "Presione el botón para escanear un activo y editar sus datos.";
        }


        // --- LÓGICA DEL CONTENEDOR 2: BUSCADOR PREDICTIVO Y FOTO INDEPENDIENTE ---
        function searchLiveAsset(texto) {
            const lista = document.getElementById('suggestions-box');
            lista.innerHTML = ''; 

            if (!texto) {
                lista.style.display = 'none';
                return;
            }

            const coincidencias = listaActivosSharePoint.filter(activo => 
                activo.id.toLowerCase().includes(texto.toLowerCase())
            );

            if (coincidencias.length > 0) {
                lista.style.display = 'block';
                coincidencias.forEach(activo => {
                    const li = document.createElement('li');
                    li.innerText = `${activo.id} — ${activo.item}`;
                    li.onclick = () => {
                        document.getElementById('search-asset-id').value = activo.id;
                        lista.style.display = 'none';
                    };
                    lista.appendChild(li);
                });
            } else {
                lista.style.display = 'none';
            }
        }

        document.addEventListener('click', function(e) {
            if (e.target.id !== 'search-asset-id') {
                document.getElementById('suggestions-box').style.display = 'none';
            }
        });

        function previewPhoto(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('photo-preview-img').src = e.target.result;
                    document.getElementById('photo-preview-box').style.display = "block";
                    globalBase64Photo = e.target.result;
                }
                reader.readAsDataURL(file);
            }
        }

        function handlePhotoSubmit(event) {
            event.preventDefault();
            const targetID = document.getElementById('search-asset-id').value;
            
            console.log("Subiendo foto al ID en SharePoint:", targetID);
            alert(`¡Evidencia fotográfica subida y vinculada al ID: ${targetID} con éxito!`);

            document.getElementById('photo-only-form').reset();
            document.getElementById('photo-preview-box').style.display = "none";
            globalBase64Photo = "";
        }
    </script>
</body>
</html>
