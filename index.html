<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Inventario y Evidencia - UGM</title>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        :root {
            --bg-dark: #172437; 
            --bg-card: #ffffff;
            --primary-blue: #1e3d99; 
            --btn-green: #00a66a;    
            --btn-blue: #1e3d99;
            --accent-line: #1e3d99;  
            --text-muted: #7f8c8d;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg-dark);
            display: flex;
            justify-content: center;
        }

        .wrapper {
            width: 100%;
            max-width: 550px; 
        }

        .main-header {
            background-color: var(--primary-blue);
            color: white;
            text-align: center;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            margin-bottom: 20px;
        }

        .main-header h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .main-header p {
            margin: 5px 0 0 0;
            font-size: 0.85rem;
            opacity: 0.9;
        }

        .card {
            background-color: var(--bg-card);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        .card-title {
            font-size: 1.05rem;
            font-weight: bold;
            color: #2c3e50;
            margin-top: 0;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-title::before {
            content: "";
            display: inline-block;
            width: 4px;
            height: 18px;
            background-color: var(--accent-line);
            border-radius: 2px;
        }

        .btn-action {
            width: 100%;
            background-color: var(--btn-green);
            color: white;
            border: none;
            padding: 14px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        #camera-preview {
            width: 100%;
            margin-top: 15px;
            border-radius: 10px;
            overflow: hidden;
            border: none !important;
        }

        .form-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 0.8rem;
            font-weight: bold;
            color: #555;
            margin-bottom: 5px;
        }

        .form-group input, .form-group select {
            padding: 12px;
            border: 1.5px solid var(--primary-blue);
            border-radius: 8px;
            font-size: 0.95rem;
            background-color: #ffffff;
            color: #333;
            box-sizing: border-box;
        }

        /* Sugerencias del buscador predictivo */
        .search-container {
            position: relative;
        }

        .suggestions-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid #ccc;
            border-top: none;
            border-radius: 0 0 8px 8px;
            max-height: 150px;
            overflow-y: auto;
            z-index: 1000;
            margin: 0;
            padding: 0;
            list-style: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: none;
        }

        .suggestions-list li {
            padding: 10px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .suggestions-list li:hover {
            background-color: #f1f4fa;
        }

        .preview-image-container {
            margin-top: 10px;
            display: none;
            text-align: center;
        }

        .preview-image-container img {
            max-width: 100%;
            max-height: 180px;
            border-radius: 8px;
            border: 1px dashed var(--primary-blue);
        }

        .btn-submit {
            width: 100%;
            background-color: var(--btn-blue);
            color: white;
            border: none;
            padding: 14px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="wrapper">

        <div class="main-header">
            <h1>Control de Inventario</h1>
            <p>Visor de Validación - Gestión de Activos</p>
        </div>

        <div class="card">
            <h2 class="card-title">Escanear Activo Fijo</h2>
            <button class="btn-action" id="btn-reader" onclick="toggleScanner()">
                📷 ESCANEAR CÓDIGO DE BARRAS / QR
            </button>
            <div id="camera-preview" style="display: none;"></div>
        </div>

        <div class="card">
            <h2 class="card-title">Cargar Evidencia Fotográfica</h2>
            
            <form id="photo-flow-form" onsubmit="handlePhotoSubmit(event)">
                
                <div class="form-group search-container">
                    <label>Buscar Código / ID del Activo ✏️</label>
                    <input type="text" id="search-asset-id" autocomplete="off" placeholder="Escribe el ID (Ej: UGM-2026...)" oninput="filterAssets(this.value)">
                    <ul id="suggestions-box" class="suggestions-list"></ul>
                </div>

                <div class="form-group">
                    <label>Capturar Foto del Activo 📸✏️</label>
                    <input type="file" id="capture-file" accept="image/*" capture="environment" required onchange="processEvidencePhoto(event)">
                    
                    <div id="evidence-preview-box" class="preview-image-container">
                        <img id="evidence-preview-img" src="" alt="Previsualización del estado">
                    </div>
                </div>

                <button type="submit" class="btn-submit">💾 Enviar Foto al Activo</button>
            </form>
        </div>

    </div>

    <script>
        // --- BASE DE DATOS SIMULADA DE SHAREPOINT (Para que el buscador predictivo funcione) ---
        const activosSharePoint = [
            { id: "UGM-001", detalle: "HP ProBook G9 - Bodega" },
            { id: "UGM-002", detalle: "iMac 21.5 (2013) - Sala de Juntas" },
            { id: "UGM-003", detalle: "Proyector Epson Láser - Sala 3" },
            { id: "UGM-104", detalle: "Cámara PTZ Logitech - Auditorio" },
            { id: "UGM-205", detalle: "Consola Allen & Heath - Audio" }
        ];

        // --- 1. LÓGICA DEL BUSCADOR PREDICTIVO (FILTRADO AL ESCRIBIR) ---
        function filterAssets(valor) {
            const lista = document.getElementById('suggestions-box');
            lista.innerHTML = ''; // Limpiar coincidencias anteriores

            if (!valor) {
                lista.style.display = 'none';
                return;
            }

            // Filtrar los IDs que contengan lo que el usuario va escribiendo
            const filtrados = activosSharePoint.filter(activo => 
                activo.id.toLowerCase().includes(valor.toLowerCase())
            );

            if (filtrados.length > 0) {
                lista.style.display = 'block';
                filtrados.forEach(activo => {
                    const li = document.createElement('li');
                    li.innerText = `${activo.id} — ${activo.detalle}`;
                    // Al hacer click en una sugerencia, rellena el campo automáticamente
                    li.onclick = () => {
                        document.getElementById('search-asset-id').value = activo.id;
                        lista.style.display = 'none';
                    };
                    lista.appendChild(li);
                });
            } else {
                lista.style.display = 'none';
            }
        }

        // Cerrar el buscador predictivo si se hace click fuera
        document.addEventListener('click', function(e) {
            if (e.target.id !== 'search-asset-id') {
                document.getElementById('suggestions-box').style.display = 'none';
            }
        });


        // --- 2. LÓGICA EXCLUSIVA DEL LECTOR DE BARRAS (TARJETA 1) ---
        let scannerInstance;
        let scanningState = false;

        function toggleScanner() {
            const previewDiv = document.getElementById('camera-preview');
            const btn = document.getElementById('btn-reader');

            if (!scanningState) {
                previewDiv.style.display = 'block';
                btn.innerText = "🛑 DETENER LECTOR";
                btn.style.backgroundColor = "#d32f2f"; 
                scanningState = true;

                scannerInstance = new Html5Qrcode("camera-preview");
                scannerInstance.start(
                    { facingMode: "environment" }, 
                    { fps: 10, qrbox: { width: 250, height: 150 } },
                    (text) => {
                        resetScannerUI();
                        // Aquí pones la acción al escanear desde este botón dedicado
                        alert("Código leído por el escáner: " + text);
                    }
                ).catch(err => {
                    alert("Error al iniciar cámara: " + err);
                    resetScannerUI();
                });
            } else {
                resetScannerUI();
            }
        }

        function resetScannerUI() {
            if (scannerInstance) {
                scannerInstance.stop().then(() => {
                    document.getElementById('camera-preview').style.display = 'none';
                    const btn = document.getElementById('btn-reader');
                    btn.innerText = "📷 ESCANEAR CÓDIGO DE BARRAS / QR";
                    btn.style.backgroundColor = "var(--btn-green)";
                    scanningState = false;
                });
            }
        }


        // --- 3. PROCESAMIENTO DE LA FOTO (TARJETA 2) ---
        let globalBase64Photo = "";

        function processEvidencePhoto(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const previewBox = document.getElementById('evidence-preview-box');
                    const previewImg = document.getElementById('evidence-preview-img');
                    
                    previewImg.src = e.target.result;
                    previewBox.style.display = "block";
                    
                    globalBase64Photo = e.target.result; // String listo para SharePoint
                }
                reader.readAsDataURL(file);
            }
        }


        // --- 4. ENVÍO DE LA FOTO AL ID ASOCIADO ---
        function handlePhotoSubmit(event) {
            event.preventDefault();

            const assetId = document.getElementById('search-asset-id').value;

            const payload = {
                idActivo: assetId,
                foto: globalBase64Photo
            };

            // Aquí se gatilla el fetch hacia tu flujo que inyecta el adjunto al ID en SharePoint
            console.log("Subiendo evidencia fotográfica...", payload);

            alert(`¡Evidencia enviada con éxito al Activo ID: ${payload.idActivo}!`);

            // Resetear formulario de foto
            document.getElementById('photo-flow-form').reset();
            document.getElementById('evidence-preview-box').style.display = "none";
            globalBase64Photo = "";
        }
    </script>
</body>
</html>
